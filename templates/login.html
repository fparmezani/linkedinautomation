<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dotnet-bot — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0D1117;
  color: #E6EDF3;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: #161B22;
  border: 1px solid #30363D;
  border-radius: 16px;
  padding: 48px 40px;
  width: 100%;
  max-width: 400px;
}

.logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, #58A6FF, #BC8CFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #8B949E;
  margin-bottom: 36px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #8B949E;
  margin-bottom: 8px;
}

input {
  width: 100%;
  background: #21262D;
  border: 1px solid #30363D;
  border-radius: 8px;
  color: #E6EDF3;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  padding: 12px 14px;
  transition: border-color .15s;
}
input:focus { outline: none; border-color: #58A6FF; }

.btn {
  width: 100%;
  background: linear-gradient(135deg, #58A6FF, #BC8CFF);
  border: none;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 700;
  padding: 14px;
  margin-top: 8px;
  transition: opacity .2s;
}
.btn:hover { opacity: .88; }

.error {
  background: rgba(255,123,114,.1);
  border: 1px solid rgba(255,123,114,.4);
  border-radius: 8px;
  color: #FF7B72;
  font-size: 13px;
  padding: 10px 14px;
  margin-bottom: 18px;
  text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">&lt;/&gt; dotnet-bot</div>
  <div class="subtitle">Acesso restrito</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label>Usuário</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
