<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1200px; height: 627px;
  background: #0D1117;
  font-family: 'Inter', sans-serif;
  color: #E6EDF3;
  overflow: hidden;
  position: relative;
}

.bg-gradient {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 0% 50%, rgba(88,166,255,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 100% 50%, rgba(188,140,255,0.06) 0%, transparent 50%);
}

.top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #3FB950, #58A6FF, #BC8CFF);
}

.layout {
  position: relative;
  display: flex;
  height: 100%;
}

.left {
  width: 440px;
  padding: 44px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid #21262D;
}

.tag {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: #3FB950;
  padding: 4px 12px;
  border: 1px solid rgba(63,185,80,0.4);
  border-radius: 16px;
  background: rgba(63,185,80,0.06);
  width: fit-content;
  margin-bottom: 16px;
}

.title {
  font-size: 32px; font-weight: 900;
  line-height: 1.12; letter-spacing: -0.02em;
  margin-bottom: 10px;
  color: #E6EDF3;
}

.subtitle {
  font-size: 14px; color: #8B949E;
  line-height: 1.5; margin-bottom: 20px;
}

.tip-box {
  background: rgba(63,185,80,0.06);
  border: 1px solid rgba(63,185,80,0.25);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex; align-items: flex-start; gap: 8px;
}

.tip-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.tip-text { font-size: 12px; color: #3FB950; font-weight: 600; line-height: 1.4; }

.author-row {
  margin-top: 16px;
  display: flex; align-items: center; gap: 10px;
}

.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #58A6FF, #BC8CFF);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 800; color: #0D1117;
}

.author-name { font-size: 12px; font-weight: 700; color: #E6EDF3; }
.author-handle { font-size: 10px; color: #58A6FF; font-family: 'JetBrains Mono', monospace; }

.right {
  flex: 1;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}

.block {
  background: rgba(22,27,34,0.9);
  border: 1px solid #30363D;
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.block:nth-child(odd) { border-left: 3px solid #58A6FF; }
.block:nth-child(even) { border-left: 3px solid #BC8CFF; }

.block-icon { font-size: 22px; flex-shrink: 0; }

.block-stat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px; font-weight: 800;
  color: #58A6FF;
  min-width: 80px;
}

.block:nth-child(even) .block-stat { color: #BC8CFF; }

.block-text { flex: 1; }
.block-label { font-size: 13px; font-weight: 700; color: #E6EDF3; }
.block-detail { font-size: 11px; color: #8B949E; margin-top: 2px; }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="top-bar"></div>

<div class="layout">
  <div class="left">
    <div class="tag">{{ cover_tag }}</div>
    <div class="title">{{ title }}</div>
    <div class="subtitle">{{ subtitle }}</div>

    <div class="tip-box">
      <span class="tip-icon">💡</span>
      <span class="tip-text">{{ tip }}</span>
    </div>

    <div class="author-row">
      <div class="avatar">{{ author_initials }}</div>
      <div>
        <div class="author-name">{{ author_name }}</div>
        <div class="author-handle">{{ author_handle }}</div>
      </div>
    </div>
  </div>

  <div class="right">
    {% for b in blocks %}
    <div class="block">
      <span class="block-icon">{{ b.icon }}</span>
      <span class="block-stat">{{ b.stat }}</span>
      <div class="block-text">
        <div class="block-label">{{ b.label }}</div>
        <div class="block-detail">{{ b.detail }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

</body>
</html>
