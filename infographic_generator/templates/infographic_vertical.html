<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px; height: 1920px;
  background: #0D1117;
  font-family: 'Inter', sans-serif;
  color: #E6EDF3;
  overflow: hidden;
  position: relative;
}

.bg-gradient {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 20% 10%, rgba(88,166,255,0.1) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 90%, rgba(188,140,255,0.08) 0%, transparent 50%);
}

.top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: linear-gradient(90deg, #3FB950, #58A6FF, #BC8CFF);
}

.content {
  position: relative;
  padding: 60px 56px;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.tag {
  display: inline-block;
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: #3FB950;
  padding: 6px 16px;
  border: 1px solid rgba(63,185,80,0.4);
  border-radius: 20px;
  background: rgba(63,185,80,0.06);
  width: fit-content;
  margin-bottom: 28px;
}

.title {
  font-size: 52px; font-weight: 900;
  line-height: 1.1; letter-spacing: -0.02em;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #E6EDF3 0%, #58A6FF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: 20px; color: #8B949E;
  line-height: 1.5; margin-bottom: 40px;
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, #58A6FF, transparent);
  margin-bottom: 36px;
}

.blocks {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.block {
  background: rgba(22,27,34,0.8);
  border: 1px solid #30363D;
  border-radius: 16px;
  padding: 24px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  transition: border-color 0.2s;
}

.block:nth-child(odd) { border-left: 3px solid #58A6FF; }
.block:nth-child(even) { border-left: 3px solid #BC8CFF; }

.block-icon {
  font-size: 36px;
  width: 60px; height: 60px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(88,166,255,0.08);
  border-radius: 12px;
  flex-shrink: 0;
}

.block-stat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px; font-weight: 800;
  color: #58A6FF;
  line-height: 1.2;
}

.block:nth-child(even) .block-stat { color: #BC8CFF; }

.block-label {
  font-size: 16px; font-weight: 700;
  color: #E6EDF3; margin-top: 2px;
}

.block-detail {
  font-size: 14px; color: #8B949E;
  margin-top: 4px; line-height: 1.4;
}

.tip-box {
  margin-top: 28px;
  background: rgba(63,185,80,0.06);
  border: 1px solid rgba(63,185,80,0.3);
  border-radius: 12px;
  padding: 20px 24px;
  display: flex; align-items: flex-start; gap: 12px;
}

.tip-icon {
  font-size: 22px; flex-shrink: 0; margin-top: 2px;
}

.tip-text {
  font-size: 16px; color: #3FB950;
  font-weight: 600; line-height: 1.5;
}

.footer {
  margin-top: 32px;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 20px;
  border-top: 1px solid #21262D;
}

.author-block {
  display: flex; align-items: center; gap: 12px;
}

.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #58A6FF, #BC8CFF);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 800; color: #0D1117;
}

.author-name { font-size: 15px; font-weight: 700; color: #E6EDF3; }
.author-handle { font-size: 12px; color: #58A6FF; font-family: 'JetBrains Mono', monospace; }

.footer-cta {
  font-size: 13px; color: #8B949E;
  font-style: italic; text-align: right; max-width: 300px;
}
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="top-bar"></div>

<div class="content">
  <div class="tag">{{ cover_tag }}</div>
  <div class="title">{{ title }}</div>
  <div class="subtitle">{{ subtitle }}</div>
  <div class="divider"></div>

  <div class="blocks">
    {% for b in blocks %}
    <div class="block">
      <div class="block-icon">{{ b.icon }}</div>
      <div>
        <div class="block-stat">{{ b.stat }}</div>
        <div class="block-label">{{ b.label }}</div>
        <div class="block-detail">{{ b.detail }}</div>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="tip-box">
    <span class="tip-icon">💡</span>
    <span class="tip-text">{{ tip }}</span>
  </div>

  <div class="footer">
    <div class="author-block">
      <div class="avatar">{{ author_initials }}</div>
      <div>
        <div class="author-name">{{ author_name }}</div>
        <div class="author-handle">{{ author_handle }}</div>
      </div>
    </div>
    <div class="footer-cta">{{ footer_cta }}</div>
  </div>
</div>

</body>
</html>
