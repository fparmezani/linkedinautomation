services:
  - type: web
    name: dotnet-bot
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium
      python -m playwright install-deps chromium
    startCommand: gunicorn web_app:app --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_REFRESH_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_DISPLAY_NAME
        sync: false
      - key: LINKEDIN_HANDLE
        sync: false
